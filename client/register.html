<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <meta name="description" content="Best ecommerce website" />
    <meta name="keywords" content="shop,ecommerce" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join now and start shopping on our ecommerce store.</p>
            </div>

            <form id="registerForm" class="auth-form">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required />

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required />

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required />

                <button type="submit" class="primary-button">Register</button>
            </form>

            <div class="auth-footer">
                <a href="login.html">Already have an account?</a>
                <a href="index.html">Back to shop</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="brand-logo">🛍️</span>
                <div>
                    <p class="footer-title">ShopEasy</p>
                    <p class="footer-copy">Built for fast and friendly online shopping.</p>
                </div>
            </div>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">My Orders</a>
                <a href="login.html">Login</a>
            </div>
        </div>
        <div class="footer-bottom">© 2026 ShopEasy. Crafted for your everyday shopping experience.</div>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
