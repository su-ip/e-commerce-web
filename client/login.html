<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="description" content="Best ecommerce website" />
    <meta name="keywords" content="shop,ecommerce" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to continue shopping with ease.</p>
            </div>

            <form id="loginForm" class="auth-form">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                />

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                />

                <button type="submit" class="primary-button">Login</button>
            </form>

            <div class="auth-footer">
                <a href="register.html">Create an account</a>
                <a href="forgot-password.html">Forgot password?</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="brand-logo">🛍️</span>
                <div>
                    <p class="footer-title">ShopEasy</p>
                    <p class="footer-copy">Built for fast and friendly online shopping.</p>
                </div>
            </div>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html">My Orders</a>
                <a href="register.html">Register</a>
            </div>
        </div>
        <div class="footer-bottom">© 2026 ShopEasy. Crafted for your everyday shopping experience.</div>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
